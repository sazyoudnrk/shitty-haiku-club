<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>クソ俳句同好会</title>
<meta name="description" content="しょうもねえ みんなで詠もう クソ俳句">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@400;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  /* 夜空 */
  --sky:#141C42;
  --sky-deep:#0E1430;
  --sky-line:rgba(212,175,106,.22);
  /* 五色の短冊 */
  --p-ao:#7FA88B;
  --p-aka:#C4566B;
  --p-ki:#E3C169;
  --p-shiro:#F0EADC;
  --p-murasaki:#8B7AA8;
  /* 金 */
  --gold:#D4AF6A;
  --gold-dim:#9A8047;
  --ink:#22203A;
  --mincho:"Shippori Mincho B1",serif;
  --gothic:"Zen Kaku Gothic New",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:var(--gothic);
  background:var(--sky-deep);
  color:#E8E4F0;
  min-height:100dvh;
  overflow-x:hidden;
}
/* 星空 */
.sky{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(1.5px 1.5px at 12% 18%, rgba(255,255,255,.55), transparent),
    radial-gradient(1px 1px at 78% 9%, rgba(255,255,255,.4), transparent),
    radial-gradient(1.5px 1.5px at 42% 62%, rgba(255,255,255,.35), transparent),
    radial-gradient(1px 1px at 88% 44%, rgba(255,255,255,.45), transparent),
    radial-gradient(1px 1px at 24% 82%, rgba(255,255,255,.3), transparent),
    radial-gradient(1.5px 1.5px at 63% 91%, rgba(255,255,255,.4), transparent),
    radial-gradient(1px 1px at 5% 51%, rgba(255,255,255,.3), transparent),
    linear-gradient(180deg,var(--sky) 0%,var(--sky-deep) 70%);
}
.wrap{position:relative;z-index:1;max-width:900px;margin:0 auto;padding:0 16px 140px}

/* ── ヘッダ ── */
header{padding:26px 0 14px;display:flex;flex-direction:column;gap:6px}
.brand{
  font-family:var(--mincho);font-weight:700;
  font-size:24px;letter-spacing:.08em;color:var(--gold);
  line-height:1.15;margin:0;
}
.tagline{
  font-size:11.5px;color:rgba(232,228,240,.5);letter-spacing:.06em;
}
/* 笹の紐 */
.cord{
  height:1px;width:100%;
  background:linear-gradient(90deg,transparent,var(--sky-line) 8%,var(--sky-line) 92%,transparent);
  margin:6px 0 0;
}

/* ── タブ ── */
nav{display:flex;gap:2px;padding:14px 0 4px;position:sticky;top:0;z-index:5;
  background:linear-gradient(180deg,var(--sky-deep) 72%,transparent);
  backdrop-filter:blur(2px)}
.tab{
  flex:1;appearance:none;border:0;background:transparent;
  font-family:var(--mincho);font-size:14px;letter-spacing:.1em;
  color:rgba(232,228,240,.45);padding:9px 0 11px;cursor:pointer;
  border-bottom:1px solid rgba(232,228,240,.1);transition:color .2s;
}
.tab[aria-selected="true"]{color:var(--gold);border-bottom:1px solid var(--gold)}
.tab:focus-visible{outline:2px solid var(--gold);outline-offset:-2px;border-radius:4px}
.meta{display:flex;justify-content:space-between;align-items:center;
  padding:10px 2px 4px;font-size:11px;color:rgba(232,228,240,.4);letter-spacing:.05em}
.reload{appearance:none;border:0;background:transparent;color:rgba(232,228,240,.55);
  font-size:11px;font-family:var(--gothic);cursor:pointer;padding:4px 6px;letter-spacing:.05em}
.reload:active{color:var(--gold)}

/* ── 短冊グリッド ── */
.grid{
  display:grid;grid-template-columns:repeat(2,1fr);gap:14px 12px;
  grid-auto-flow:dense;padding-top:6px;
}
@media(min-width:560px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:800px){.grid{grid-template-columns:repeat(4,1fr)}}

.tz{
  position:relative;padding-top:20px;
  animation:drop .45s cubic-bezier(.2,.8,.3,1) backwards;
}
.tz.wide{grid-column:span 2}
@keyframes drop{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}

/* 吊り紐 */
.tz::before{
  content:"";position:absolute;top:0;left:50%;width:1px;height:20px;
  background:linear-gradient(180deg,transparent,var(--gold-dim));
}
.paper{
  position:relative;min-height:255px;border-radius:2px;
  padding:20px 12px 34px;
  display:flex;justify-content:center;
  color:var(--ink);
  box-shadow:0 6px 18px rgba(0,0,0,.32);
  transform-origin:50% -20px;
  animation:sway 6s ease-in-out infinite;
  background-image:repeating-linear-gradient(90deg,rgba(0,0,0,.035) 0 1px,transparent 1px 5px);
}
/* 綴じ穴 */
.paper::before{
  content:"";position:absolute;top:7px;left:50%;transform:translateX(-50%);
  width:5px;height:5px;border-radius:50%;
  background:var(--sky-deep);box-shadow:inset 0 1px 1px rgba(0,0,0,.5);
}
@keyframes sway{0%,100%{transform:rotate(-1.1deg)}50%{transform:rotate(1.1deg)}}
.tz:nth-child(3n+1) .paper{animation-duration:7.2s;animation-delay:-.9s}
.tz:nth-child(3n+2) .paper{animation-duration:5.4s;animation-delay:-2.4s}
.tz:nth-child(4n)   .paper{animation-duration:8s;animation-delay:-3.6s}

.c0{background-color:var(--p-ao)}
.c1{background-color:var(--p-aka)}
.c2{background-color:var(--p-ki)}
.c3{background-color:var(--p-shiro)}
.c4{background-color:var(--p-murasaki)}
.c0,.c1,.c4{color:#FBF8F2}

.ku{
  writing-mode:vertical-rl;text-orientation:upright;
  font-family:var(--mincho);font-size:15.5px;line-height:1.85;
  letter-spacing:.09em;max-height:100%;overflow:hidden;
  white-space:pre-wrap;word-break:break-all;text-align:start;
}
/* 星（いいね） */
.star{
  position:absolute;left:0;right:0;bottom:0;
  display:flex;align-items:center;justify-content:center;gap:5px;
  appearance:none;border:0;background:transparent;cursor:pointer;
  padding:9px 0 11px;font-family:var(--gothic);font-size:12px;
  color:inherit;opacity:.62;transition:opacity .18s,transform .18s;
  letter-spacing:.06em;
}
.star:active{transform:scale(.93)}
.star.on{opacity:1;font-weight:700}
.star:focus-visible{outline:2px solid currentColor;outline-offset:-3px;border-radius:3px}
.star .mark{font-size:14px;line-height:1}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.4)}100%{transform:scale(1)}}
.star.burst .mark{animation:pop .34s ease-out}

/* ── 空・読込 ── */
.note{
  grid-column:1/-1;text-align:center;padding:64px 20px;
  font-family:var(--mincho);color:rgba(232,228,240,.5);font-size:14px;line-height:2;
}
.note b{display:block;color:var(--gold);font-size:16px;margin-bottom:8px;font-weight:400}

/* ── 詠むボタン ── */
.fab{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(22px + env(safe-area-inset-bottom));z-index:20;
  appearance:none;border:1px solid var(--gold);
  background:var(--sky);color:var(--gold);
  font-family:var(--mincho);font-size:16px;letter-spacing:.12em;
  padding:13px 28px;border-radius:999px;cursor:pointer;
  box-shadow:0 8px 26px rgba(0,0,0,.45);
}
.fab:active{transform:translateX(-50%) scale(.96)}
.fab:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

/* ── 投稿シート ── */
.scrim{position:fixed;inset:0;z-index:30;background:rgba(6,9,24,.72);
  opacity:0;pointer-events:none;transition:opacity .22s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:31;
  background:var(--sky);border-top:1px solid var(--sky-line);
  border-radius:16px 16px 0 0;padding:18px 18px calc(20px + env(safe-area-inset-bottom));
  transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.3,1);
  max-width:900px;margin:0 auto;
}
.sheet.open{transform:none}
.sheet h2{margin:0 0 14px;font-family:var(--mincho);font-weight:400;
  font-size:15px;letter-spacing:.14em;color:var(--gold)}
.editor{display:flex;gap:14px;align-items:stretch}
.preview{
  flex:0 0 92px;min-height:170px;border-radius:2px;padding:14px 8px;
  display:flex;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,.3);
}
.preview .ku{font-size:14px}
.preview.empty .ku{opacity:.35}
.field{flex:1;display:flex;flex-direction:column;gap:8px}
textarea{
  flex:1;width:100%;resize:none;min-height:120px;
  background:rgba(255,255,255,.05);border:1px solid rgba(232,228,240,.16);
  border-radius:6px;padding:11px 12px;color:#E8E4F0;
  font-family:var(--mincho);font-size:16px;line-height:1.9;letter-spacing:.05em;
}
textarea:focus{outline:none;border-color:var(--gold)}
textarea::placeholder{color:rgba(232,228,240,.28)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.count{font-size:11.5px;color:rgba(232,228,240,.45);font-variant-numeric:tabular-nums}
.count.over{color:var(--p-aka);font-weight:700}
.btns{display:flex;gap:8px}
.btn{
  appearance:none;border:1px solid rgba(232,228,240,.2);border-radius:999px;
  background:transparent;color:rgba(232,228,240,.7);
  font-family:var(--gothic);font-size:13px;padding:9px 18px;cursor:pointer;letter-spacing:.06em;
}
.btn.primary{background:var(--gold);border-color:var(--gold);color:#1A1533;font-weight:700}
.btn:disabled{opacity:.35;cursor:default}
.btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.hint{font-size:11px;color:rgba(232,228,240,.38);line-height:1.7;margin:10px 0 0}

/* ── トースト ── */
.toast{
  position:fixed;left:50%;bottom:96px;transform:translate(-50%,10px);
  z-index:40;background:var(--gold);color:#1A1533;
  font-size:13px;font-weight:700;padding:10px 20px;border-radius:999px;
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;letter-spacing:.08em;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ── セットアップ警告 ── */
.setup{
  margin:18px 0;padding:16px 16px;border:1px solid var(--p-ki);
  border-radius:8px;background:rgba(227,193,105,.09);
  font-size:13px;line-height:1.85;color:#F0E6C8;
}
.setup b{color:var(--p-ki)}
.setup code{font-family:ui-monospace,monospace;font-size:12px;
  background:rgba(0,0,0,.3);padding:1px 5px;border-radius:3px}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<div class="sky"></div>

<div class="wrap">
  <header>
    <h1 class="brand">クソ俳句同好会</h1>
    <span class="tagline">しょうもねえ　みんなで詠もう　クソ俳句</span>
  </header>
  <div class="cord"></div>

  <div id="setup" hidden></div>

  <nav role="tablist">
    <button class="tab" role="tab" data-mode="random"  aria-selected="true">ランダム</button>
    <button class="tab" role="tab" data-mode="popular" aria-selected="false">週間人気</button>
    <button class="tab" role="tab" data-mode="recent"  aria-selected="false">新着</button>
  </nav>

  <div class="meta">
    <span id="modeNote">直近30日から、ランダムに100句</span>
    <button class="reload" id="reload" type="button">↻ 読み直す</button>
  </div>

  <main class="grid" id="grid" role="tabpanel"></main>
</div>

<button class="fab" id="fab" type="button">ここで一句</button>

<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <h2 id="sheetTitle">一句、吊るす</h2>
  <div class="editor">
    <div class="preview empty c3" id="preview"><div class="ku" id="previewKu">　</div></div>
    <div class="field">
      <textarea id="input" maxlength="120" rows="4"
        placeholder="ふるいけや&#10;かわずとびこむ&#10;みずのおと"
        aria-label="俳句の本文"></textarea>
      <div class="row">
        <span class="count" id="count">0 / 100</span>
        <div class="btns">
          <button class="btn" id="cancel" type="button">やめる</button>
          <button class="btn primary" id="submit" type="button" disabled>吊るす</button>
        </div>
      </div>
    </div>
  </div>
  <p class="hint">匿名です。名前も履歴も残りません。吊るした句はあとから消せません。改行すると短冊が行を変えます。</p>
</section>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
import {
  getFirestore, collection, addDoc, getDocs, updateDoc, doc,
  query, orderBy, limit, where, serverTimestamp, increment, Timestamp
} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

/* ══════════════════════════════════════════════════
   ① ここに Firebase コンソールの設定を貼り替える
   ══════════════════════════════════════════════════ */
const firebaseConfig = {
  apiKey:            "AIzaSyDW5HkquhS0XIGgdI3rL1N3pyqVlg-ZeUM",
  authDomain:        "shitty-haiku-club.firebaseapp.com",
  projectId:         "shitty-haiku-club",
  storageBucket:     "shitty-haiku-club.firebasestorage.app",
  messagingSenderId: "636909163464",
  appId:             "1:636909163464:web:2346b84ba75a0ee58466fd"
};

/* ══════════════════════════════════════════════════
   ② 調整用の定数
   ══════════════════════════════════════════════════ */
const CONF = {
  COLLECTION:    "haiku",
  MAX_CHARS:     100,   // 1句の上限文字数
  SHOW:          100,   // 一覧に出す件数
  FETCH_LIMIT:   200,   // 1回のクエリで取る件数（読み取り回数に直結）
  POPULAR_DAYS:  7,     // 週間人気の対象期間
  RANDOM_DAYS:   30,    // ランダムの母集団
  COOLDOWN_SEC:  30     // 連投クールダウン（0で無効）
};

const LS_LIKED = "dq.liked";
const LS_LAST  = "dq.lastPost";

/* ── 起動 ── */
const grid    = document.getElementById("grid");
const setupEl = document.getElementById("setup");
let db = null, mode = "random";
const cache = { random:null, popular:null, recent:null };

if (String(firebaseConfig.apiKey).startsWith("PASTE")) {
  showSetup();
} else {
  try {
    db = getFirestore(initializeApp(firebaseConfig));
    load();
  } catch (e) {
    grid.innerHTML = note("つながりませんでした", "Firebase の設定を確認してください。");
    console.error(e);
  }
}

function showSetup(){
  setupEl.hidden = false;
  setupEl.className = "setup";
  setupEl.innerHTML = `<b>あと1手順あります</b><br>
    Firebase コンソールで作ったウェブアプリの設定を、この HTML の
    <code>firebaseConfig</code> に貼り替えてください。それまで投稿と表示は動きません。`;
  grid.innerHTML = note("準備中", "設定を入れると、ここに短冊が並びます。");
}

/* ── タブ ── */
const MODE_NOTE = {
  random:  `直近${CONF.RANDOM_DAYS}日から、ランダムに${CONF.SHOW}句`,
  popular: `直近${CONF.POPULAR_DAYS}日で、星の多い順に${CONF.SHOW}句`,
  recent:  `新しい順に${CONF.SHOW}句`
};
document.querySelectorAll(".tab").forEach(t=>{
  t.addEventListener("click", ()=>{
    if (t.dataset.mode === mode) return;
    mode = t.dataset.mode;
    document.querySelectorAll(".tab").forEach(x=>
      x.setAttribute("aria-selected", String(x.dataset.mode === mode)));
    document.getElementById("modeNote").textContent = MODE_NOTE[mode];
    load();
  });
});
document.getElementById("reload").addEventListener("click", ()=>{
  cache[mode] = null;
  load();
});

/* ── 取得 ── */
async function load(){
  if (!db) return;
  if (cache[mode]) return render(cache[mode]);

  grid.innerHTML = note("読み込んでいます", "");
  try {
    const col = collection(db, CONF.COLLECTION);
    let q;
    if (mode === "recent") {
      q = query(col, orderBy("createdAt","desc"), limit(CONF.SHOW));
    } else {
      const days  = mode === "popular" ? CONF.POPULAR_DAYS : CONF.RANDOM_DAYS;
      const since = Timestamp.fromDate(new Date(Date.now() - days*864e5));
      q = query(col, where("createdAt",">=",since),
                     orderBy("createdAt","desc"), limit(CONF.FETCH_LIMIT));
    }
    const snap = await getDocs(q);
    let list = snap.docs.map(d => ({ id:d.id, ...d.data() }));

    if (mode === "popular") list.sort((a,b)=>(b.likes||0)-(a.likes||0));
    if (mode === "random")  shuffle(list);
    list = list.slice(0, CONF.SHOW);

    cache[mode] = list;
    render(list);
  } catch (e) {
    console.error(e);
    grid.innerHTML = note("読み込めませんでした", "通信を確かめて、もう一度お試しください。");
  }
}

function shuffle(a){
  for (let i=a.length-1; i>0; i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
}

/* ── 描画 ── */
function render(list){
  if (!list.length){
    const msg = mode === "popular"
      ? `この${CONF.POPULAR_DAYS}日はまだ静かです。`
      : "まだ一句もありません。";
    grid.innerHTML = note(msg, "最初の駄句を吊るしてください。");
    return;
  }
  const liked = getLiked();
  grid.innerHTML = "";
  list.forEach((p,i)=>{
    const text  = String(p.text||"");
    const el    = document.createElement("article");
    el.className = "tz" + (text.length > 24 ? " wide" : "");
    el.style.animationDelay = Math.min(i,12)*22 + "ms";

    const on = liked.has(p.id);
    el.innerHTML = `
      <div class="paper c${colorOf(p.id)}">
        <div class="ku"></div>
        <button class="star${on?" on":""}" type="button"
          aria-label="この句に星をつける" ${on?'aria-pressed="true"':'aria-pressed="false"'}>
          <span class="mark">${on?"★":"☆"}</span><span class="n">${p.likes||0}</span>
        </button>
      </div>`;
    el.querySelector(".ku").textContent = text;
    el.querySelector(".star").addEventListener("click", ev => like(p, ev.currentTarget));
    grid.appendChild(el);
  });
}

function note(title, body){
  return `<p class="note"><b>${title}</b>${body}</p>`;
}

/* idから五色を決める（保存不要） */
function colorOf(id){
  let h = 0;
  for (const ch of String(id)) h = (h*31 + ch.charCodeAt(0)) >>> 0;
  return h % 5;
}

/* ── 星 ── */
function getLiked(){
  try { return new Set(JSON.parse(localStorage.getItem(LS_LIKED) || "[]")); }
  catch { return new Set(); }
}
async function like(post, btn){
  const liked = getLiked();
  if (liked.has(post.id)) return toast("もう星をつけています");

  liked.add(post.id);
  localStorage.setItem(LS_LIKED, JSON.stringify([...liked]));
  post.likes = (post.likes||0) + 1;
  btn.classList.add("on","burst");
  btn.setAttribute("aria-pressed","true");
  btn.querySelector(".mark").textContent = "★";
  btn.querySelector(".n").textContent = post.likes;
  setTimeout(()=>btn.classList.remove("burst"), 360);

  try {
    await updateDoc(doc(db, CONF.COLLECTION, post.id), { likes: increment(1) });
  } catch (e) {
    console.error(e);
    toast("星をおくれませんでした");
  }
}

/* ── 投稿 ── */
const sheet   = document.getElementById("sheet");
const scrim   = document.getElementById("scrim");
const input   = document.getElementById("input");
const countEl = document.getElementById("count");
const submit  = document.getElementById("submit");
const preview = document.getElementById("preview");
const prevKu  = document.getElementById("previewKu");

document.getElementById("fab").addEventListener("click", openSheet);
document.getElementById("cancel").addEventListener("click", closeSheet);
scrim.addEventListener("click", closeSheet);
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeSheet(); });

function openSheet(){
  if (!db) return toast("まだ設定が入っていません");
  sheet.classList.add("open"); scrim.classList.add("open");
  preview.className = "preview empty c" + Math.floor(Math.random()*5);
  setTimeout(()=>input.focus(), 260);
}
function closeSheet(){
  sheet.classList.remove("open"); scrim.classList.remove("open");
  input.blur();
}

input.addEventListener("input", ()=>{
  const t = input.value;
  const n = [...t].length;
  countEl.textContent = `${n} / ${CONF.MAX_CHARS}`;
  countEl.classList.toggle("over", n > CONF.MAX_CHARS);
  submit.disabled = !t.trim() || n > CONF.MAX_CHARS;
  prevKu.textContent = t.trim() ? t : "　";
  preview.classList.toggle("empty", !t.trim());
});

submit.addEventListener("click", async ()=>{
  const text = input.value.trim().replace(/\n{3,}/g, "\n\n");
  const n = [...text].length;
  if (!text || n > CONF.MAX_CHARS) return;

  if (CONF.COOLDOWN_SEC > 0){
    const last = Number(localStorage.getItem(LS_LAST) || 0);
    const wait = Math.ceil((CONF.COOLDOWN_SEC*1000 - (Date.now()-last)) / 1000);
    if (wait > 0) return toast(`あと${wait}秒お待ちください`);
  }

  submit.disabled = true;
  try {
    await addDoc(collection(db, CONF.COLLECTION), {
      text, likes:0, reports:0, createdAt: serverTimestamp()
    });
    localStorage.setItem(LS_LAST, String(Date.now()));
    input.value = "";
    input.dispatchEvent(new Event("input"));
    closeSheet();
    toast("吊るしました");
    cache.recent = cache.random = null;
    if (mode !== "popular") load();
  } catch (e) {
    console.error(e);
    toast("吊るせませんでした");
    submit.disabled = false;
  }
});

/* ── トースト ── */
let toastTimer;
function toast(msg){
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove("show"), 2000);
}
</script>
